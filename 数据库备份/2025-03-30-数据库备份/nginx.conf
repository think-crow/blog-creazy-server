
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

server{
	 #SSL 默认访问端口号为 443
     
	listen 443 ssl; 
  
#请填写绑定证书的域名
     
server_name www.rwany.net; 
     
#请填写证书文件的绝对路径。此路径仅供参考，具体请您按照实际目录操作
     
ssl_certificate C:/nginx-1.25.5/nginx-1.25.5/rwany.net_bundle.crt; 
  
   
#请填写私钥文件的绝对路径。此路径仅供参考，具体请您按照实际目录操作
     
ssl_certificate_key C:/nginx-1.25.5/nginx-1.25.5/rwany.net.key; 
     
ssl_session_timeout 5m;
     

#请按照以下协议配置
     
ssl_protocols TLSv1.2 TLSv1.3; 
     

#请按照以下套件配置，配置加密套件，写法遵循 openssl 标准。
     
ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE; 
     
ssl_prefer_server_ciphers on;



        location / {

            root   html;
            index  index.html index.htm;
	    try_files $uri $uri/ /index.html;
        proxy_set_header X-Real-IP $remote_addr; # 设置真实IP地址
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; #真实IP地址传递给Node.js应用程序
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_cache_bypass $http_upgrade;

    
        }

   location /api/ {
        proxy_pass http://127.0.0.1:3000;  # 将请求转发到后端 Node.js 服务器

  proxy_set_header X-Real-IP $remote_addr; # 设置真实IP地址
